name: Private apartment collection
on:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Collection lane (same bounded request budget)
        type: choice
        options: [auto, backfill, recent, history]
        default: auto
permissions:
  contents: read
concurrency:
  group: private-property-collection
  cancel-in-progress: false
jobs:
  collect:
    # Public standard Linux runners only. Activation follows a verified manual run.
    if: github.event.repository.private == false && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PROPERTY_COLLECTION_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Collect and verify private archive checkpoint
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROPERTY_ARCHIVE_BROKER_TOKEN: ${{ secrets.PROPERTY_ARCHIVE_BROKER_TOKEN }}
          PROPERTY_ARCHIVE_BROKER_URL: ${{ secrets.PROPERTY_ARCHIVE_BROKER_URL }}
          PROPERTY_ARCHIVE_CONFIG_JSON: ${{ secrets.PROPERTY_ARCHIVE_CONFIG }}
          COLLECTION_MODE: ${{ inputs.mode || 'auto' }}
          COLLECTION_REQUESTS: ${{ vars.PROPERTY_COLLECTION_MAX_REQUESTS || '25' }}
          COLLECTION_BYTES: ${{ vars.PROPERTY_COLLECTION_MAX_BYTES || '16777216' }}
        run: |
          python -B -m pipeline.property_automation --execute \
            --work-parent "$RUNNER_TEMP/property-collection" \
            --mode "$COLLECTION_MODE" --max-requests "$COLLECTION_REQUESTS" --max-bytes "$COLLECTION_BYTES"
      # Intentionally no upload-artifact, cache, public data upload or deployment.
      # Raw responses and checkpoints belong only in the private D1 archive.
