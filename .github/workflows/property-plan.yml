name: Property collection plan (no source calls)
on:
  workflow_dispatch:
    inputs:
      regions:
        description: Checked-in official legal-code registry JSON path
        required: true
        default: 'config/molit-legal-region-registry.json'
        type: string
      months:
        description: Total months including current month, maximum 241 (240 completed plus current provisional)
        default: '241'
        type: string
      scope:
        description: Acquisition scope (existing nationwide data remains preserved)
        default: priority-nine
        type: choice
        options: [priority-nine, nationwide]
permissions:
  contents: read
concurrency:
  group: property-collection-plan
  cancel-in-progress: false
jobs:
  plan:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate paths and write plan only
        env:
          REGISTRY_INPUT: ${{ inputs.regions }}
          MONTHS_INPUT: ${{ inputs.months }}
          SCOPE_INPUT: ${{ inputs.scope || 'priority-nine' }}
        run: |
          python - <<'PY'
          import os
          from pipeline.real_estate_plan import main
          main(['--regions', os.environ['REGISTRY_INPUT'], '--months', os.environ['MONTHS_INPUT'], '--scope', os.environ['SCOPE_INPUT'], '--require-scope-complete'])
          # Stdlib only: no --execute mode, key, network, SQLite, publication or raw upload.
          PY
