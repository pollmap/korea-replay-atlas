# Install only after DNS and the separate certificate have been verified.
limit_req_zone $binary_remote_addr zone=korea_replay_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=korea_replay_connections:10m;
server {
    listen 80;
    server_name korea-replay.62-171-141-206.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/korea-replay; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name korea-replay.62-171-141-206.sslip.io;
    ssl_certificate /etc/letsencrypt/live/korea-replay.62-171-141-206.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/korea-replay.62-171-141-206.sslip.io/privkey.pem;
    access_log off;
    client_max_body_size 1k;
    limit_req_status 429;
    limit_conn_status 429;
    location / {
        limit_except GET { deny all; }
        limit_req zone=korea_replay_api burst=20 nodelay;
        limit_conn korea_replay_connections 20;
        proxy_pass http://127.0.0.1:8437;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }
}
